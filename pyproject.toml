[project]
name = "nyxstrike"
version = "2.0.0"
requires-python = ">=3.10"
dependencies = [
    "flask>=2.3.0,<4.0.0",
    "requests>=2.31.0,<3.0.0",
    "psutil>=5.9.0,<6.0.0",
    "fastmcp[tasks]>=4.0.3,<5.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "selenium>=4.48.0,<5.0.0",
    "webdriver-manager>=4.0.0,<5.0.0",
    "aiohttp>=3.8.0,<4.0.0",
    "h2>=4.0.0,<5.0.0",
    "PyMySQL>=1.1.2,<2.0.0",
    "wcwidth>=0.8.3,<1.0.0",
    "cryptography>=49.0.0,<50.0.0",
    "flask-limiter>=3.5.0,<4.0.0",
    "phaseaccess>=0.1.0,<1.0.0",
    "stingxss>=0.1.0,<1.0.0",
    "breachsql>=0.1.0,<1.0.0",
    "vaultrip>=0.1.0,<1.0.0",
    "commonhuman-payloads>=0.1.7,<1.0.0",
    "commonhuman-core>=0.1.7,<1.0.0",
]

[project.optional-dependencies]
tools = [
    "bbot>=3.0.2",
    "httpx>=0.28.1",
    "uro>=1.0.2",
    "dirsearch>=0.4.3",
    "waymore",
    "chardet>=3.0.2,<6.0.0",
    "volatility3>=2.27.0",
    "angr>=9.2.205,<10.0.0",
    "checkov>=3.0.0",
    "ROPgadget>=7.0.0,<8.0.0",
    "one_gadget>=1.0.0,<2.0.0",
    "social-analyzer>=0.45.0",
]
big = [
    "kube-hunter>=0.6.8",
    "shodan>=1.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]
